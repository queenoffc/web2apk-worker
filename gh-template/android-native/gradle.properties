# Project-wide Gradle settings.
#
# CATATAN: file ini dipakai runner GitHub Actions (ubuntu-latest = 4 vCPU /
# 16 GB RAM, x86_64), BUKAN Termux/ARM. Jadi setelannya dioptimalkan untuk
# kecepatan build di CI:
#   - heap 2 GB (runner punya 16 GB)
#   - parallel + build cache AKTIF -> task yang tidak berubah tidak diulang
#   - vfs.watch dimatikan (di CI tidak ada gunanya, malah makan resource)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

org.gradle.native=false
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true

# Fix R8/D8 crash pada dexing transform di AGP baru
android.useFullClasspathForDexingTransform=true
