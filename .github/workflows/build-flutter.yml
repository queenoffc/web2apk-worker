# build-flutter.yml
# ─────────────────────────────────────────────────────────────────────────
# Dipakai worker GitHub Actions bot QUEEN WEB2APK untuk mode ZIP -> APK
# dengan project Flutter (ada pubspec.yaml). Nama file ini HARUS
# build-flutter.yml (lihat worker/githubWorker.js).
#
# Artifact hasil build HARUS bernama `apk-<jobId>`.

name: build-flutter
run-name: flutter-${{ inputs.jobId }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: ID job dari bot
        required: true
        type: string
      userId:
        description: ID user Telegram
        required: false
        type: string
      payload:
        description: JSON payload dari bot
        required: false
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Lisensi Android SDK + platform yang dipakai template. Tanpa ini, Gradle
      # bisa gagal saat harus mengunduh platform (lisensi belum diterima).
      # Tidak memakai android-actions/setup-android karena action itu meminta
      # paket 'tools' yang sudah dihapus dari repo Google.
      - name: Siapkan Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 \
              || "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 \
              || true
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache Gradle (dependency AndroidX/AGP) supaya tidak diunduh ulang.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-flutter-${{ runner.os }}-${{ hashFiles('work/project/**/*.gradle*', 'work/project/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-flutter-${{ runner.os }}-

      - name: Siapkan project
        env:
          JOB_ID: ${{ inputs.jobId }}
          PAYLOAD: ${{ inputs.payload }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/prepare-project.js

      # NDK: plugin seperti jni/speech_to_text kadang minta NDK lebih baru
      # daripada yang dipakai project ("configured with Android NDK 27..., but
      # jni requires 28.2.13676358"). Di sini NDK disamakan + ndkVersion di
      # build.gradle(.kts) ikut disetel. Ganti versinya lewat env
      # ANDROID_NDK_VERSION saat dispatch kalau perlu.
      - name: Samakan versi NDK
        working-directory: work/project
        run: |
          set -e
          NDK="${ANDROID_NDK_VERSION:-28.2.13676358}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "ndk;$NDK" >/dev/null 2>&1 || echo "NDK $NDK belum bisa dipasang (Gradle akan coba unduh sendiri)"
          fi
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            if grep -q 'ndkVersion' "$f"; then
              # Pertahankan gaya file: 'ndkVersion "x"' atau 'ndkVersion = "x"'
              sed -i -E "s/ndkVersion([[:space:]]*=?[[:space:]]*)\"[^\"]+\"/ndkVersion\\1\"$NDK\"/" "$f"
            else
              sed -i "0,/android {/s//android {\n    ndkVersion \"$NDK\"/" "$f"
            fi
            echo "--- $f ---"; grep -n 'ndkVersion' "$f" || true
          done

      - name: Build APK
        env:
          BUILD_TYPE: ${{ fromJSON(inputs.payload).buildType }}
        run: |
          set -e
          cd work/project
          flutter pub get
          # Sunting: --target-platform membuang ABI x86_64 (hanya untuk emulator)
          # sehingga satu kompilasi AOT penuh tidak perlu dijalankan.
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release --target-platform android-arm,android-arm64
          fi

      - name: Kumpulkan APK
        run: |
          set -e
          mkdir -p out
          find work/project/build/app/outputs -name "*.apk" -exec cp {} out/ \;
          ls -la out
          test "$(ls -1 out/*.apk 2>/dev/null | wc -l)" -gt 0 || { echo "Tidak ada APK hasil build"; exit 1; }

      - name: Upload artifact (nama wajib apk-<jobId>)
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ inputs.jobId }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 3
