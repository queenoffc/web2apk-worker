# build-android.yml
# ─────────────────────────────────────────────────────────────────────────
# Dipakai worker GitHub Actions bot QUEEN WEB2APK untuk mode:
#   - URL  -> APK  (project native diambil dari gh-template/android-native)
#   - ZIP  -> APK  (project ZIP berisi gradlew / Android Gradle)
#
# Nama file ini HARUS build-android.yml karena bot memanggilnya lewat
# /actions/workflows/build-android.yml/dispatches (lihat worker/githubWorker.js).
#
# Artifact hasil build HARUS bernama `apk-<jobId>` supaya bot bisa
# mengunduhnya (worker mencari artifact dengan nama tersebut lebih dulu).

name: build-android
run-name: android-${{ inputs.jobId }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: ID job dari bot
        required: true
        type: string
      userId:
        description: ID user Telegram
        required: false
        type: string
      payload:
        description: JSON payload dari bot
        required: false
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # CATATAN: action android-actions/setup-android@v3 DIPENSIUNKAN di sini.
      # Action itu meminta paket 'tools' yang sudah DIHAPUS dari repo Google,
      # sehingga langkahnya gagal dengan:
      #   Warning: Failed to find package 'tools'
      #   Error: ... sdkmanager ... failed with exit code 1
      # Runner GitHub sudah menyediakan Android SDK (ANDROID_HOME sudah diisi),
      # jadi cukup pasang lisensi + paket yang memang ada.
      - name: Setup Android SDK (SDK bawaan runner)
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          if [ -d "$SDK" ]; then
            export ANDROID_HOME="$SDK"
            export ANDROID_SDK_ROOT="$SDK"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          fi

          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          echo "sdkmanager: ${SDKMGR:-tidak ditemukan}"

          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            # Paket yang BENAR-BENAR ada di repo Google (jangan pernah 'tools').
            "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 \
              || "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 \
              || "$SDKMGR" "platform-tools" >/dev/null 2>&1 \
              || true
          fi

          echo "--- platform terpasang ---"
          ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools terpasang ---"
          ls "$SDK/build-tools" 2>/dev/null || true

      # Cache Gradle: build kedua dan seterusnya jauh lebih cepat karena
      # dependency + hasil task tidak diunduh/dikerjakan ulang.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gh-template/android-native/**/*.gradle*', 'gh-template/android-native/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Siapkan project
        env:
          JOB_ID: ${{ inputs.jobId }}
          PAYLOAD: ${{ inputs.payload }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/prepare-project.js

      - name: Build APK
        env:
          BUILD_TYPE: ${{ fromJSON(inputs.payload).buildType }}
        run: |
          set -e
          cd work/project
          chmod +x gradlew
          VARIANT="assembleRelease"
          if [ "$BUILD_TYPE" = "debug" ]; then VARIANT="assembleDebug"; fi
          ./gradlew "$VARIANT" --no-daemon --stacktrace --build-cache

      - name: Kumpulkan APK
        run: |
          set -e
          mkdir -p out
          find work/project -name "*.apk" -not -name "*-unsigned.apk" -exec cp {} out/ \;
          ls -la out
          test "$(ls -1 out/*.apk 2>/dev/null | wc -l)" -gt 0 || { echo "Tidak ada APK hasil build"; exit 1; }

      - name: Upload artifact (nama wajib apk-<jobId>)
        uses: actions/upload-artifact@v5
        with:
          name: apk-${{ inputs.jobId }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 3
